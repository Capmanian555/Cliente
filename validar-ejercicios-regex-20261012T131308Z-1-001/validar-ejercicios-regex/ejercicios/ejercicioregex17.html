<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 17</title>
</head>
<body>
  <h1>No límite de palabra</h1>
  <p>Comprueba que el patrón encuentra ato dentro de gato usando \B.</p>
  <script>
    const texto = "gato";
    console.log(/\Bato/.test(texto));
  </script>

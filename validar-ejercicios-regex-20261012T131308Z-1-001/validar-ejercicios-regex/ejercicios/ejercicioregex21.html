<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 21</title>
</head>
<body>
  <h1>Repetición exacta</h1>
  <p>Comprueba que el código tiene exactamente tres letras minúsculas seguidas de dos dígitos.</p>
  <script>
    const codigo = "abc42";
    console.log(/^[a-z]{3}\d{2}$/.test(codigo));
  </script>
</body>
</html>

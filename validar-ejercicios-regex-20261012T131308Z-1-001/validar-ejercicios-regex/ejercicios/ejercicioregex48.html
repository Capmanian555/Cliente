<!doctype html>

  <title>Ejercicio regex 48</title>

<body>
  <h1>Método `matchAll`</h1>
  <p>Usa matchAll para recoger todos los números y sus grupos capturados. Convierte el iterador en un array antes de mostrarlo.</p>
  <script>
    const texto = "p5 q12 r300";
    console.log(texto.matchAll(/(\d+)/g));
  </script>

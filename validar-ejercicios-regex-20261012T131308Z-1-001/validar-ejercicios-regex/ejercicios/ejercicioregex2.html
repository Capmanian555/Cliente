<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 2</title>
</head>
<body>
  <h1>Cualquier carácter</h1>
  <p>Usa . para comprobar si el patrón encuentra casa en &quot;cosa, casa y caso&quot;.</p>
  <script>
    const texto = "cosa, casa y caso";
    console.log(/.casa./.test(texto));
  </script>
</body>

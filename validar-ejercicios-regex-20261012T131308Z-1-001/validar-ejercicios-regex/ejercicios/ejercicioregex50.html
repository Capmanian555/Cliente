  <title>Ejercicio regex 50</title>
</head>
<body>
  <h1>Método `split`</h1>
  <p>Divide la lista por comas o punto y coma, eliminando los espacios opcionales después del separador.</p>
  <script>
    const texto = "rojo, verde; azul, amarillo";
    console.log(texto.split(/[,;]\s*/));
  </script>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 58</title>
</head>
<body>
  <h1>Reemplazar todas las coincidencias con `replaceAll`</h1>
  <p>Convierte todas las letras a en o. Usa una regex global.</p>
  <script>
    const texto = "banana";
    console.log(texto.replaceAll(/a/g, "o"));
  </script>
</body>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 44</title>
</head>
<body>
  <h1>Conjuntos Unicode ampliados</h1>
  <p>Si tu versión de JavaScript admite el flag v, usa la resta de conjuntos para comprobar si &quot;A&quot; es una letra Unicode que no pertenece al rango [a-z]. Ejecuta este ejercicio solo en un entorno que soporte v.</p>
  <script>
    console.log(/^[\p{L}--[a-z]]$/v.test("A"));
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 1</title>
</head>
<body>
  <h1>Buscar una palabra</h1>
  <p>Comprueba si el texto contiene la palabra sol.</p>
  <script>
    const texto = "Hoy hace sol";
    console.log(/sol/i.test(texto));
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 62</title>
</head>
<body>
  <h1>Fecha con formato ISO</h1>
  <p>Comprueba el formato AAAA-MM-DD. Por ahora solo valida la forma, no que el día y el mes existan en el calendario.</p>
  <script>
    const fecha = "2026-10-02";
    console.log(/^\d{4}-\d{2}-\d{2}$/.test(fecha));
  </script>
</body>
</html>

  <title>Ejercicio regex 35</title>

<body>
  <h1>Ignorar mayúsculas y minúsculas</h1>
  <p>Comprueba si la frase contiene javascript sin importar cómo se escriba en mayúsculas.</p>
  <script>
    const texto = "Estoy aprendiendo JAVASCRIPT";
    console.log(/javascript/i.test(texto));
  </script>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 3</title>
</head>
<body>
  <h1>Punto literal</h1>
  <p>Comprueba que &quot;v1.2&quot; contiene un punto real entre los números; el punto no debe significar «cualquier carácter».</p>
  <script>
    const version = "v1.2";
    console.log(/[.]/.test(version));
  </script>
</body>
</html>

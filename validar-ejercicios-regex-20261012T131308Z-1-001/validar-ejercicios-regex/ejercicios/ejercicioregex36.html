<!doctype html>
<html lang="es">

  <title>Ejercicio regex 36</title>

<body>
  <h1>Búsqueda global</h1>
  <p>Obtén todas las coincidencias de dígitos en una sola llamada.</p>

    const texto = "a1b22c333";
    console.log(texto.match(/\d/g));
  </script>

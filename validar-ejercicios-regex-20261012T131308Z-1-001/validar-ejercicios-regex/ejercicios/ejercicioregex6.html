<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 6</title>
</head>
<body>
  <h1>Caracteres de palabra</h1>
  <p>Obtén la primera secuencia de caracteres \w de &quot;hola_mundo 2026&quot;.</p>
  <script>
    const texto = "hola_mundo 2026";
    console.log(texto.match(/^\w+/)[0]);
  </script>
</body>

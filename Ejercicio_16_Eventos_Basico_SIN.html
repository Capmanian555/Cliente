<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Ejercicio 16 - Zonas de la pantalla</title>
    <style type="text/css">
        body {
            font-family: arial, helvetica;
            margin: 0;
            padding: 0;
        }
        #info {
            width: 200px;
            border: thin solid silver;
            padding: .5em;
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: #fcfcfc;
        }
        #info h1 {
            margin: 0;
            font-size: 1.1em;
        }
    </style>
    <script type="text/javascript">

        // TU CÓDIGO JAVASCRIPT DEBE IR AQUÍ
        function examinaPantalla(elEvento) {
            // Pista 1: Obtén las coordenadas del clic con elEvento.clientX y elEvento.clientY
            // Pista 2: Para saber las dimensiones de la ventana usa window.innerWidth y window.innerHeight
            // (o document.body.clientWidth / clientHeight si necesitas compatibilidad antigua)
			let x = elEvento.clientX;
			let y = elEvento.clientY;

			let ancho = window.innerWidth;
			let alto = window.innerHeight;

			let mitadAncho = ancho / 2;
			let mitadAlto = alto / 2;

			if (x < mitadAncho && y < mitadAlto) {
                document.getElementById("info").innerHTML =
				"Has pulsado en la zona izquierda arriba";
			}
			else if (x < mitadAncho && y >= mitadAlto) {
				document.getElementById("info").innerHTML =
                "Has pulsado en la zona izquierda abajo";
			}
			else if (x >= mitadAncho && y < mitadAlto) {
				document.getElementById("info").innerHTML =
                "Has pulsado en la zona derecha arriba";
			}
			else {
				document.getElementById("info").innerHTML =
                "Has pulsado en la zona derecha abajo";
			}
			
        }

        window.onload = function() {
            document.onclick = examinaPantalla;
        }

    </script>
</head>
<body>
<div id="info">
    <h1>Zonas de pantalla</h1>
    <p>Haz clic en cualquier parte de la ventana para averiguar en qué cuadrante estás pulsando.</p>
</div>
</body>
</html>
